(()=>{
const stage=document.getElementById('stage'),world=document.getElementById('world'),pic=document.getElementById('pic');
let outfit='a',side='front',scale=1,x=0,y=0,dragging=false,lastX=0,lastY=0;
const pointers=new Map();let pinchStartDist=0,pinchStartScale=1;
const key=()=>outfit+'_'+side;
const apply=()=>{world.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;};
const fit=()=>{const sw=stage.clientWidth,sh=stage.clientHeight,iw=pic.naturalWidth||800,ih=pic.naturalHeight||1200;scale=Math.min(sw/iw,sh/ih)*.94;x=0;y=0;apply();};
const show=()=>{pic.onload=fit;pic.src=IMAGES[key()];if(pic.complete)fit();};
const zoomAt=(f,cx,cy)=>{const r=stage.getBoundingClientRect(),px=cx-(r.left+r.width/2),py=cy-(r.top+r.height/2),n=Math.min(8,Math.max(.35,scale*f)),rr=n/scale;x=px-(px-x)*rr;y=py-(py-y)*rr;scale=n;apply();};
document.querySelectorAll('.side').forEach(b=>b.onclick=()=>{document.querySelectorAll('.side').forEach(x=>x.classList.remove('active'));b.classList.add('active');side=b.dataset.side;show();});
document.querySelectorAll('.outfit').forEach(b=>b.onclick=()=>{document.querySelectorAll('.outfit').forEach(x=>x.classList.remove('active'));b.classList.add('active');outfit=b.dataset.outfit;show();});
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);},{passive:false});
stage.ondblclick=()=>fit();
stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;}else if(pointers.size===2){dragging=false;const p=[...pointers.values()];pinchStartDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pinchStartScale=scale;}};
stage.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinchStartDist>0){const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2,t=Math.min(8,Math.max(.35,pinchStartScale*(d/pinchStartDist)));zoomAt(t/scale,mx,my);pinchStartScale=scale;pinchStartDist=d;}return;}if(!dragging)return;x+=e.clientX-lastX;y+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply();};
const end=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinchStartDist=0;if(pointers.size===0)dragging=false;else if(pointers.size===1){const o=[...pointers.values()][0];dragging=true;lastX=o.x;lastY=o.y;}};
stage.onpointerup=end;stage.onpointercancel=end;
document.getElementById('zoomIn').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1.2,r.left+r.width/2,r.top+r.height/2);};
document.getElementById('zoomOut').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1/1.2,r.left+r.width/2,r.top+r.height/2);};
document.getElementById('reset').onclick=()=>fit();
window.onresize=fit;show();
})();
</script>
